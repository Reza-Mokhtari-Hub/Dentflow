<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="lam1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="lam2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bg)" rx="24" />

  <!-- Technical grid circles -->
  <circle cx="250" cy="200" r="140" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  <circle cx="250" cy="200" r="170" fill="none" stroke="#2dd4bf" stroke-width="0.5" stroke-dasharray="10 5" opacity="0.3" />

  <!-- Title Badge -->
  <rect x="30" y="30" width="100" height="30" rx="15" fill="#f59e0b" opacity="0.9" />
  <text x="80" y="49" font-family="sans-serif" font-size="12" font-weight="900" fill="#000" text-anchor="middle">دانستنی زیبایی</text>

  <!-- Comparison Columns / Two Teeth Veneers -->
  <g transform="translate(130, 200)">
    <!-- 1. Laminate Veneer (Left) -->
    <g transform="translate(0, 0)">
      <!-- Outline base -->
      <path d="M -30 -80 C -50 -80, -40 10, -25 20 C -20 23, 10 23, 15 20 C 30 10, 40 -80, 20 -80 Z" fill="url(#lam1)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#glow)" />
      <!-- Shine lines -->
      <path d="M -15 -70 C -5 -70, 0 -60, 0 -60 C 0 -60, 5 -70, 15 -70 L -15 -70 Z" fill="#ffffff" />
      <!-- Star spark -->
      <g transform="translate(15, -40)">
        <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8" />
      </g>
      <!-- Label below -->
      <rect x="-40" y="45" width="80" height="25" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="61" font-family="sans-serif" font-size="10" font-weight="900" fill="#38bdf8" text-anchor="middle">لمینت سرامیکی</text>
    </g>
  </g>

  <g transform="translate(370, 200)">
    <!-- 2. Composite Veneer (Right) -->
    <g transform="translate(0, 0)">
      <!-- Outline base -->
      <path d="M -30 -80 C -50 -80, -40 10, -25 20 C -20 23, 10 23, 15 20 C 30 10, 40 -80, 20 -80 Z" fill="url(#lam2)" stroke="#115e59" stroke-width="1.5" />
      <!-- Shine lines -->
      <path d="M -15 -70 C -5 -70, 0 -60, 0 -60 C 0 -60, 5 -70, 15 -70 L -15 -70 Z" fill="#ffffff" opacity="0.9" />
      <!-- Label below -->
      <rect x="-40" y="45" width="80" height="25" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="61" font-family="sans-serif" font-size="10" font-weight="900" fill="#2dd4bf" text-anchor="middle">ونیر کامپوزیت</text>
    </g>
  </g>

  <!-- Split line -->
  <line x1="250" y1="80" x2="250" y2="300" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="250" cy="190" r="16" fill="#047857" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="250" y="194" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">VS</text>

</svg>
