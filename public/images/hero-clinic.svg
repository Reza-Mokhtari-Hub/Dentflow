<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Abstract tech background details -->
  <circle cx="700" cy="100" r="150" fill="#2dd4bf" opacity="0.05" filter="url(#glow)" />
  <circle cx="100" cy="500" r="250" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Waves (DentFlow lines) -->
  <path d="M-100 450 C 150 400, 300 550, 550 450 C 700 390, 800 420, 900 450 L 900 600 L -100 600 Z" fill="#0d9488" opacity="0.15" />
  <path d="M-100 480 C 200 440, 350 520, 600 460 C 720 420, 800 440, 900 480 L 900 600 L -100 600 Z" fill="url(#accentGrad)" opacity="0.1" />

  <!-- Clinical Isometric/3D Elements -->
  <!-- Dental Shield representing care & protection -->
  <g transform="translate(400, 260)" filter="url(#glow)">
    <!-- Base Glow -->
    <path d="M -80 -100 Q 0 -130 80 -100 Q 80 10 -10 90 L 0 100 L 10 90 Q -80 10 -80 -100 Z" fill="#2dd4bf" opacity="0.1" transform="scale(1.1)" />
    <!-- Shield Outline -->
    <path d="M -80 -100 Q 0 -130 80 -100 Q 80 10 0 90 Q -80 10 -80 -100 Z" fill="url(#shieldGrad)" stroke="#2dd4bf" stroke-width="3" />
    
    <!-- Stylized Perfect Tooth inside Shield -->
    <g transform="translate(0, -10) scale(1.1)">
      <!-- Left side of tooth -->
      <path d="M -25 -30 C -45 -30, -35 15, -20 30 C -15 35, -5 35, -5 10 C -5 5, -5 -10, -25 -30 Z" fill="#ffffff" opacity="0.95" />
      <!-- Right side of tooth -->
      <path d="M 25 -30 C 45 -30, 35 15, 20 30 C 15 35, 5 35, 5 10 C 5 5, 5 -10, 25 -30 Z" fill="#e2e8f0" opacity="0.9" />
      <!-- Top shine/crown -->
      <path d="M -15 -25 C -5 -25, 0 -15, 0 -15 C 0 -15, 5 -25, 15 -25 C 25 -25, 25 -15, 25 -15 L -25 -15 C -25 -15, -25 -25, -15 -25 Z" fill="#ffffff" />
      <!-- Sparkle -->
      <path d="M 15 -5 L 18 -15 L 28 -18 L 18 -21 L 15 -31 L 12 -21 L 2 -18 L 12 -15 Z" fill="#fdba74" />
    </g>
  </g>

  <!-- Flowing Tech Rings -->
  <circle cx="400" cy="250" r="160" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="8 8" opacity="0.2" />
  <circle cx="400" cy="250" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="15 10" opacity="0.25" />

  <!-- Overlaid HUD / Text Graphic -->
  <rect x="50" y="50" width="180" height="70" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="80" cy="85" r="12" fill="#0d9488" opacity="0.2" />
  <circle cx="80" cy="85" r="6" fill="#2dd4bf" />
  <text x="105" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">DentFlow AI</text>
  <text x="105" y="96" font-family="sans-serif" font-size="9" fill="#94a3b8">Active Modeling</text>

  <rect x="580" y="460" width="170" height="80" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="605" y="490" font-family="sans-serif" font-size="14" font-weight="900" fill="#2dd4bf">3D Scan V3</text>
  <text x="605" y="510" font-family="sans-serif" font-size="11" fill="#e2e8f0">Precision Guided</text>
  <text x="605" y="525" font-family="sans-serif" font-size="9" fill="#64748b">100% Bio-Compatible</text>

</svg>
