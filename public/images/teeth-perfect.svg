<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>
    <linearGradient id="gum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="teethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" /> <!-- Pure Hollywood White -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="24" />

  <!-- Oral cavity dark background -->
  <path d="M 100 200 Q 300 80 500 200 Q 300 320 100 200 Z" fill="#4c0519" />

  <!-- Gums Top -->
  <path d="M 100 200 Q 300 100 500 200 Q 300 140 100 200 Z" fill="url(#gum)" />

  <!-- Perfect Teeth Array top -->
  <g id="top-teeth" transform="translate(0, -5)">
    <!-- Tooth 1 Left -->
    <path d="M 180 160 C 180 135, 210 135, 210 162 C 210 185, 180 185, 180 160 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Tooth 2 -->
    <path d="M 210 162 C 210 135, 242 135, 242 165 C 242 188, 210 188, 210 162 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Center Tooth Left (Big, symmetrical) -->
    <path d="M 242 165 C 242 133, 298 133, 298 168 C 298 193, 242 193, 242 165 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1.2" />
    <!-- Center Tooth Right (Big, symmetrical) -->
    <path d="M 298 168 C 298 133, 354 133, 354 165 C 354 193, 298 193, 298 168 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1.2" />
    <!-- Tooth 5 Right -->
    <path d="M 354 165 C 354 135, 386 135, 386 162 C 386 188, 354 188, 354 165 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Tooth 6 Right -->
    <path d="M 386 162 C 386 135, 416 135, 416 160 C 416 185, 386 185, 386 162 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
  </g>

  <!-- Gums Bottom -->
  <path d="M 100 200 Q 300 300 500 200 Q 300 260 100 200 Z" fill="url(#gum)" />

  <!-- Bottom Teeth Array (Perfectly straight alignment) -->
  <g id="bottom-teeth" transform="translate(0, 5)">
    <!-- Tooth 1 Bottom Left -->
    <path d="M 195 230 C 195 248, 222 248, 222 230 C 222 214, 195 214, 195 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Tooth 2 Bottom -->
    <path d="M 222 230 C 222 248, 249 248, 249 230 C 249 214, 222 214, 222 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Center Left Bottom -->
    <path d="M 249 230 C 249 248, 276 248, 276 230 C 276 214, 249 214, 249 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Center Right Bottom -->
    <path d="M 276 230 C 276 248, 303 248, 303 230 C 303 214, 276 214, 276 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Tooth 5 Bottom -->
    <path d="M 303 230 C 303 248, 330 248, 330 230 C 330 214, 303 214, 303 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
    <!-- Tooth 6 Bottom -->
    <path d="M 330 230 C 330 248, 357 248, 357 230 C 357 214, 330 214, 330 230 Z" fill="url(#teethGrad)" stroke="#115e59" stroke-width="1" />
  </g>

  <!-- Sparkles / Lens Flares for extreme white shine -->
  <g transform="translate(255, 175)" filter="url(#glow)">
    <path d="M 0 -15 L 3 -3 L 15 0 L 3 3 L 0 15 L -3 3 L -15 0 L -3 -3 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#99f6e4" />
  </g>
  <g transform="translate(345, 170)" filter="url(#glow)">
    <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2" fill="#99f6e4" />
  </g>

  <!-- Frame Label -->
  <rect x="235" y="340" width="130" height="30" rx="15" fill="#0d9488" />
  <text x="300" y="359" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">بعد از درمان (دنت فلو ونیر)</text>
</svg>
