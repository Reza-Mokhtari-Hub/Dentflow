  <circle cx="43" cy="44" r="2" fill="#1e293b" />
  <circle cx="57" cy="44" r="2" fill="#1e293b" />
  
  <!-- Friendly Professional Smile -->
  <path d="M 43 51 Q 50 58 57 51" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />

  <!-- Doctor/Lab Coat shoulders -->
