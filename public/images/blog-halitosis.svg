<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bg)" rx="24" />

  <!-- Clean Bubbles / Oxygen Ions -->
  <circle cx="100" cy="120" r="12" fill="#38bdf8" opacity="0.2" />
  <circle cx="120" cy="100" r="6" fill="#38bdf8" opacity="0.3" />
  <circle cx="400" cy="280" r="18" fill="#38bdf8" opacity="0.15" />
  <circle cx="370" cy="310" r="8" fill="#38bdf8" opacity="0.25" />
  <circle cx="280" cy="80" r="14" fill="#38bdf8" opacity="0.15" />

  <!-- Title Badge -->
  <rect x="30" y="30" width="100" height="30" rx="15" fill="#0284c7" opacity="0.9" />
  <text x="80" y="49" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">بهداشت و سلامت</text>

  <!-- Giant Tooth in a protective shield of freshness -->
  <g transform="translate(250, 210)">
    <!-- Protective Shield Aura -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" opacity="0.4" />
    <path d="M -110 -20 Q -90 90 0 110 Q 90 90 110 -20 Q 0 -60 -110 -20 Z" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.3" />

    <!-- Healthy Protected Tooth -->
    <g transform="scale(1.2)" filter="url(#glow)">
      <!-- Left side of tooth -->
      <path d="M -22 -28 C -40 -28, -32 15, -18 28 C -14 32, -4 32, -4 10 C -4 5, -4 -10, -22 -28 Z" fill="url(#toothGrad)" />
      <!-- Right side of tooth -->
      <path d="M 22 -28 C 40 -28, 32 15, 18 28 C 14 32, 4 32, 4 10 C 4 5, 4 -10, 22 -28 Z" fill="#f8fafc" />
      <!-- Top crown groove -->
      <path d="M -15 -23 C -5 -23, 0 -15, 0 -15 C 0 -15, 5 -23, 15 -23 L -15 -23 Z" fill="#ffffff" />
    </g>

    <!-- Sparkles signifying ultimate minty freshness -->
    <g transform="translate(-40, -45)" filter="url(#glow)">
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8" />
    </g>
    <g transform="translate(45, 30)" filter="url(#glow)">
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#2dd4bf" />
    </g>
    <g transform="translate(35, -40)" filter="url(#glow)">
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#ffffff" />
    </g>
  </g>

</svg>
