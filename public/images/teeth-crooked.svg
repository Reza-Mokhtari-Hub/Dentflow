<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <linearGradient id="gum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="teethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" /> <!-- Ivory/Yellow Tint -->
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="24" />

  <!-- Oral cavity dark background -->
  <path d="M 100 200 Q 300 80 500 200 Q 300 320 100 200 Z" fill="#4c0519" />

  <!-- Gums Top -->
  <path d="M 100 200 Q 300 100 500 200 Q 300 140 100 200 Z" fill="url(#gum)" />

  <!-- Crooked Teeth Array top -->
  <g id="top-teeth" transform="translate(0, -5)">
    <!-- Tooth 1 Left -->
    <path d="M 180 160 C 180 135, 210 130, 215 165 C 215 185, 185 190, 180 160 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Tooth 2 (Slightly tilted) -->
    <path d="M 215 168 C 220 140, 250 135, 252 172 C 248 195, 215 192, 215 168 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" transform="rotate(-6, 235, 168)" />
    <!-- Center Tooth Left (Big, slightly overlapping and yellowish) -->
    <path d="M 250 172 C 255 135, 298 140, 295 180 C 290 200, 250 200, 250 172 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Center Tooth Right (Rotated backwards, leaving gap) -->
    <path d="M 305 170 C 308 140, 345 142, 340 175 C 335 192, 305 192, 305 170 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" transform="rotate(8, 325, 170)" />
    <!-- Tooth 5 Right -->
    <path d="M 342 165 C 345 135, 378 135, 375 165 C 370 185, 345 185, 342 165 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Tooth 6 Right -->
    <path d="M 375 162 C 378 140, 405 140, 405 162 C 405 180, 375 180, 375 162 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1.5" />
  </g>

  <!-- Gums Bottom -->
  <path d="M 100 200 Q 300 300 500 200 Q 300 260 100 200 Z" fill="url(#gum)" />

  <!-- Bottom Teeth Array (Slightly crowded) -->
  <g id="bottom-teeth" transform="translate(0, 5)">
    <!-- Tooth 1 Bottom Left -->
    <path d="M 195 230 C 195 250, 225 250, 220 230 C 218 215, 195 215, 195 230 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" />
    <!-- Tooth 2 Bottom (tilted) -->
    <path d="M 220 228 C 223 252, 248 248, 245 226 C 242 212, 220 214, 220 228 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" transform="rotate(5, 232, 228)" />
    <!-- Center Left Bottom -->
    <path d="M 246 226 C 248 250, 278 250, 274 224 C 270 210, 246 210, 246 226 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" />
    <!-- Center Right Bottom (Slightly lower down/crooked) -->
    <path d="M 276 222 C 278 244, 305 244, 302 221 C 298 208, 276 208, 276 222 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" />
    <!-- Tooth 5 Bottom -->
    <path d="M 304 227 C 306 248, 332 248, 330 227 C 328 214, 304 214, 304 227 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" />
    <!-- Tooth 6 Bottom -->
    <path d="M 332 230 C 334 250, 360 250, 358 230 C 356 216, 332 216, 332 230 Z" fill="url(#teethGrad)" stroke="#b45309" stroke-width="1" />
  </g>

  <!-- Bad teeth spots or discoloration -->
  <ellipse cx="280" cy="180" rx="3" ry="5" fill="#d97706" opacity="0.4" />
  <ellipse cx="230" cy="175" rx="2" ry="4" fill="#d97706" opacity="0.3" />

  <!-- Frame Label -->
  <rect x="235" y="340" width="130" height="30" rx="15" fill="#f87171" />
  <text x="300" y="359" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">قبل از درمان (بدرنگ و نامرتب)</text>
</svg>
